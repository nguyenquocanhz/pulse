<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulse — Trạng thái</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #21262d;
      --text: #e6edf3; --muted: #7d8590;
      --up: #3fb950; --down: #f85149; --degraded: #d29922;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f8fa; --panel: #fff; --border: #d0d7de;
        --text: #1f2328; --muted: #656d76;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 60px; }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
    h1 { font-size: 20px; margin: 0; }
    .overall {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 16px; border-radius: 8px; font-weight: 600;
      margin: 18px 0 24px; width: 100%;
    }
    .overall.operational { background: color-mix(in srgb, var(--up) 15%, transparent); color: var(--up); }
    .overall.degraded    { background: color-mix(in srgb, var(--degraded) 15%, transparent); color: var(--degraded); }
    .overall.down        { background: color-mix(in srgb, var(--down) 15%, transparent); color: var(--down); }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot.up { background: var(--up); } .dot.down { background: var(--down); }
    .dot.unknown { background: var(--muted); }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;
    }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .name { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .target { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; margin-top: 2px; }
    .metrics { text-align: right; font-size: 13px; color: var(--muted); white-space: nowrap; }
    .metrics b { color: var(--text); font-weight: 600; }
    .bars { display: flex; gap: 2px; margin-top: 14px; height: 28px; align-items: flex-end; }
    .bar { flex: 1; min-width: 2px; border-radius: 2px; background: var(--up); opacity: .85; }
    .bar.down { background: var(--down); }
    .bar.gap { background: var(--border); }
    .err { color: var(--down); font-size: 12px; margin-top: 10px; font-family: ui-monospace, monospace; word-break: break-word; }
    footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 30px; }
    .spin { animation: s 1s linear infinite; display: inline-block; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="title">Pulse</h1>
    </header>
    <div id="overall" class="overall">
      <span class="spin">◌</span> Đang tải…
    </div>
    <div id="list"></div>
    <footer id="footer"></footer>
  </div>

  <script>
    const OVERALL_TEXT = {
      operational: 'Tất cả hệ thống bình thường',
      degraded: 'Một số dịch vụ gặp sự cố',
      down: 'Hệ thống ngừng hoạt động',
    };

    const fmtMs = (ms) => (ms == null ? '—' : ms + 'ms');
    const fmtTime = (t) => new Date(t).toLocaleTimeString('vi-VN');
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

    function bars(history) {
      if (!history || !history.length) return '';
      // vẽ tối đa 40 thanh cuối cho gọn trên mobile
      const h = history.slice(-40);
      return h.map((r) => `<div class="bar ${r.ok ? '' : 'down'}" title="${fmtTime(r.t)} · ${fmtMs(r.ms)}"></div>`).join('');
    }

    function card(m) {
      const state = m.state || 'unknown';
      const uptime = m.uptime == null ? '—' : m.uptime + '%';
      const err = state === 'down' && m.last && m.last.error
        ? `<div class="err">${esc(m.last.error)}</div>` : '';
      return `
        <div class="card">
          <div class="card-top">
            <div>
              <div class="name"><span class="dot ${state}"></span>${esc(m.name)}</div>
              <div class="target">${esc(m.target)}</div>
            </div>
            <div class="metrics">
              <div>uptime <b>${uptime}</b></div>
              <div>tb <b>${fmtMs(m.avgMs)}</b></div>
            </div>
          </div>
          <div class="bars">${bars(m.history)}</div>
          ${err}
        </div>`;
    }

    async function tick() {
      try {
        const res = await fetch('/api/status', { cache: 'no-store' });
        const data = await res.json();

        document.getElementById('title').textContent = data.title;
        document.title = data.title;

        const o = document.getElementById('overall');
        o.className = 'overall ' + data.overall;
        o.textContent = OVERALL_TEXT[data.overall] || data.overall;

        document.getElementById('list').innerHTML = data.monitors.map(card).join('');
        document.getElementById('footer').textContent =
          'Cập nhật ' + new Date(data.updatedAt).toLocaleString('vi-VN');
      } catch (e) {
        document.getElementById('overall').textContent = 'Không kết nối được máy chủ Pulse';
      }
    }

    tick();
    setInterval(tick, 10000);
  </script>
</body>
</html>
