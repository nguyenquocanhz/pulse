<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulse</title>
  <style>
    /* =========================================================================
       THEME. Mỗi theme là một bộ biến CSS. Đổi theme = đổi [data-theme] ở <html>.
       Rút từ ui-ux-pro-max: slate dev-tool, OLED đen, terminal matrix, nord, sáng.
       ========================================================================= */
    :root {
      --radius: 10px;
      --font: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
    }

    /* Slate — mặc định, nền tối dev-tool + xanh "run" */
    :root, [data-theme="slate"] {
      --bg: #0f172a; --panel: #1e293b; --panel-2: #172033; --border: #334155;
      --text: #f8fafc; --muted: #94a3b8;
      --up: #22c55e; --down: #ef4444; --degraded: #eab308;
      --accent: #22c55e; --glow: none; --body-font: var(--font);
    }

    /* Midnight — OLED đen tuyệt đối, tiết kiệm pin, tương phản cao */
    [data-theme="midnight"] {
      --bg: #000000; --panel: #0a0a0a; --panel-2: #0f0f0f; --border: #1f1f1f;
      --text: #ffffff; --muted: #8a8a8a;
      --up: #00e676; --down: #ff5252; --degraded: #ffd740;
      --accent: #00e676; --glow: none; --body-font: var(--font);
    }

    /* Terminal — matrix xanh trên đen, chữ monospace, có ánh sáng nhẹ */
    [data-theme="terminal"] {
      --bg: #0d0d0d; --panel: #111511; --panel-2: #0f130f; --border: #1c261c;
      --text: #00ff66; --muted: #4c8a5c;
      --up: #00ff66; --down: #ff3366; --degraded: #ffcc00;
      --accent: #00ff66; --glow: 0 0 8px currentColor; --body-font: var(--mono);
    }

    /* Nord — bảng màu lạnh dịu, rất được ưa chuộng */
    [data-theme="nord"] {
      --bg: #2e3440; --panel: #3b4252; --panel-2: #353c4a; --border: #4c566a;
      --text: #eceff4; --muted: #81a1c1;
      --up: #a3be8c; --down: #bf616a; --degraded: #ebcb8b;
      --accent: #88c0d0; --glow: none; --body-font: var(--font);
    }

    /* Light — sáng, sạch, tương phản đạt WCAG */
    [data-theme="light"] {
      --bg: #f6f8fa; --panel: #ffffff; --panel-2: #f0f3f6; --border: #d0d7de;
      --text: #1f2328; --muted: #656d76;
      --up: #1a7f37; --down: #cf222e; --degraded: #9a6700;
      --accent: #1a7f37; --glow: none; --body-font: var(--font);
    }

    /* Người chưa chọn theme: theo hệ điều hành */
    @media (prefers-color-scheme: light) {
      :root:not([data-theme]) {
        --bg: #f6f8fa; --panel: #ffffff; --panel-2: #f0f3f6; --border: #d0d7de;
        --text: #1f2328; --muted: #656d76;
        --up: #1a7f37; --down: #cf222e; --degraded: #9a6700; --accent: #1a7f37;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--body-font); line-height: 1.5;
      transition: background .2s ease, color .2s ease;
    }
    .wrap { max-width: 780px; margin: 0 auto; padding: 28px 20px 60px; }

    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { font-size: 20px; margin: 0; letter-spacing: -0.02em; }

    /* ---- điều khiển: ngôn ngữ + theme ---- */
    .controls { display: flex; align-items: center; gap: 12px; }
    #lang {
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 5px 8px; font-size: 13px; cursor: pointer;
      font-family: var(--body-font);
    }
    #lang:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .themes { display: flex; gap: 6px; }
    .swatch {
      width: 22px; height: 22px; border-radius: 50%; cursor: pointer; padding: 0;
      border: 2px solid transparent; transition: border-color .15s ease, transform .15s ease;
      position: relative;
    }
    .swatch:hover { transform: translateY(-1px); }
    .swatch[aria-pressed="true"] { border-color: var(--text); }
    .swatch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .overall {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-radius: var(--radius); font-weight: 600;
      margin: 20px 0 22px; border: 1px solid var(--border);
    }
    .overall.operational { color: var(--up); }
    .overall.degraded    { color: var(--degraded); }
    .overall.down        { color: var(--down); }
    .overall .dot { box-shadow: var(--glow); }

    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot.up { background: var(--up); } .dot.down { background: var(--down); }
    .dot.unknown { background: var(--muted); }

    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px;
      transition: background .2s ease, border-color .2s ease;
    }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .name { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .name .dot { box-shadow: var(--glow); }
    .target { color: var(--muted); font-size: 12px; font-family: var(--mono); margin-top: 3px; }
    .metrics { text-align: right; font-size: 13px; color: var(--muted); white-space: nowrap; }
    .metrics b { color: var(--text); font-weight: 600; }

    .bars { display: flex; gap: 2px; margin-top: 14px; height: 26px; align-items: flex-end; }
    .bar { flex: 1; min-width: 2px; border-radius: 2px; background: var(--up); opacity: .9; height: 100%; }
    .bar.down { background: var(--down); }

    /* journey: các chặng của một luồng, hiện như trace */
    .journey { margin-top: 14px; display: flex; flex-direction: column; gap: 7px; }
    .jstep { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .jdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .jdot.up { background: var(--up); } .jdot.down { background: var(--down); }
    .jname { flex-shrink: 0; width: 130px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .jbar { flex: 1; height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
    .jfill { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
    .jfill.down { background: var(--down); }
    .jms { flex-shrink: 0; width: 56px; text-align: right; color: var(--muted); font-family: var(--mono); }

    .err { color: var(--down); font-size: 12px; margin-top: 10px; font-family: var(--mono); word-break: break-word; }
    footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 28px; }

    /* Spinner SVG, không dùng emoji làm icon */
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      .spin { animation-duration: 3s; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="title">Pulse</h1>
      <div class="controls">
        <select id="lang" aria-label="Language"></select>
        <div class="themes" id="themes" role="group" aria-label="Theme"></div>
      </div>
    </header>

    <div id="overall" class="overall">
      <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" stroke-opacity="0.25"/>
        <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      </svg>
      Đang tải…
    </div>

    <div id="list"></div>
    <footer id="footer"></footer>
  </div>

  <script>
    // ---- đa ngôn ngữ ----
    // Thêm ngôn ngữ mới = thêm một khoá ở đây, không đụng phần còn lại.
    const I18N = {
      vi: {
        _name: 'Tiếng Việt',
        loading: 'Đang tải…',
        operational: 'Tất cả hệ thống bình thường',
        degraded: 'Một số dịch vụ gặp sự cố',
        down: 'Hệ thống ngừng hoạt động',
        unknown: 'Đang chờ dữ liệu…',
        offline: 'Không kết nối được máy chủ Pulse',
        uptime: 'uptime',
        avg: 'tb',
        updated: 'Cập nhật',
      },
      en: {
        _name: 'English',
        loading: 'Loading…',
        operational: 'All systems operational',
        degraded: 'Some services are having issues',
        down: 'All systems down',
        unknown: 'Waiting for data…',
        offline: 'Cannot reach the Pulse server',
        uptime: 'uptime',
        avg: 'avg',
        updated: 'Updated',
      },
    };
    const LANG_KEY = 'pulse-lang';
    let lang = localStorage.getItem(LANG_KEY)
      || (navigator.language || '').slice(0, 2)
      || 'en';
    if (!I18N[lang]) lang = 'en';
    const t = (k) => (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k;

    function buildLangSwitcher() {
      const sel = document.getElementById('lang');
      sel.innerHTML = Object.entries(I18N)
        .map(([code, v]) => `<option value="${code}">${v._name}</option>`)
        .join('');
      sel.value = lang;
      sel.addEventListener('change', () => {
        lang = sel.value;
        localStorage.setItem(LANG_KEY, lang);
        document.documentElement.setAttribute('lang', lang);
        tick(); // vẽ lại ngay bằng dữ liệu hiện có
      });
      document.documentElement.setAttribute('lang', lang);
    }

    // ---- theme ----
    const THEMES = [
      { id: 'slate',    color: '#22c55e', label: 'Slate' },
      { id: 'midnight', color: '#000000', label: 'Midnight' },
      { id: 'terminal', color: '#00ff66', label: 'Terminal' },
      { id: 'nord',     color: '#88c0d0', label: 'Nord' },
      { id: 'light',    color: '#ffffff', label: 'Sáng' },
    ];
    const KEY = 'pulse-theme';

    function applyTheme(id) {
      document.documentElement.setAttribute('data-theme', id);
      localStorage.setItem(KEY, id);
      document.querySelectorAll('.swatch').forEach((b) =>
        b.setAttribute('aria-pressed', String(b.dataset.theme === id)),
      );
    }

    function buildThemeSwitcher() {
      const host = document.getElementById('themes');
      host.innerHTML = THEMES.map((t) =>
        `<button class="swatch" data-theme="${t.id}" title="${t.label}"
           aria-label="Giao diện ${t.label}" aria-pressed="false"
           style="background:${t.color}; border-color:${t.color === '#ffffff' ? '#d0d7de' : 'transparent'}"></button>`,
      ).join('');
      host.querySelectorAll('.swatch').forEach((b) =>
        b.addEventListener('click', () => applyTheme(b.dataset.theme)),
      );
    }

    const saved = localStorage.getItem(KEY);
    if (saved) document.documentElement.setAttribute('data-theme', saved);
    buildThemeSwitcher();
    if (saved) applyTheme(saved);

    // ---- trạng thái ----
    const locale = () => (lang === 'vi' ? 'vi-VN' : 'en-US');
    const fmtMs = (ms) => (ms == null ? '—' : ms + 'ms');
    const fmtTime = (ts) => new Date(ts).toLocaleTimeString(locale());
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function bars(history) {
      if (!history || !history.length) return '';
      return history.slice(-40).map((r) =>
        `<div class="bar ${r.ok ? '' : 'down'}" title="${fmtTime(r.t)} · ${fmtMs(r.ms)}"></div>`,
      ).join('');
    }

    function card(m) {
      const state = m.state || 'unknown';
      const uptime = m.uptime == null ? '—' : m.uptime + '%';
      const err = state === 'down' && m.last && m.last.error
        ? `<div class="err">${esc(m.last.error)}</div>` : '';
      // journey: hiện latency từng chặng như một trace
      const steps = m.last && m.last.steps ? journeySteps(m.last.steps) : '';
      return `
        <div class="card">
          <div class="card-top">
            <div>
              <div class="name"><span class="dot ${state}"></span>${esc(m.name)}</div>
              <div class="target">${esc(m.target)}</div>
            </div>
            <div class="metrics">
              <div>${t('uptime')} <b>${uptime}</b></div>
              <div>${t('avg')} <b>${fmtMs(m.avgMs)}</b></div>
            </div>
          </div>
          <div class="bars">${bars(m.history)}</div>
          ${steps}
          ${err}
        </div>`;
    }

    // Vẽ các chặng của journey như một trace: mỗi chặng một dòng, có latency,
    // độ dài thanh tỉ lệ với latency để thấy chặng nào chậm nhất.
    function journeySteps(steps) {
      const max = Math.max(...steps.map((s) => s.ms || 0), 1);
      const rows = steps.map((s) => {
        const w = Math.max(3, Math.round(((s.ms || 0) / max) * 100));
        return `
          <div class="jstep">
            <span class="jdot ${s.ok ? 'up' : 'down'}"></span>
            <span class="jname">${esc(s.name)}</span>
            <span class="jbar"><span class="jfill ${s.ok ? '' : 'down'}" style="width:${w}%"></span></span>
            <span class="jms">${fmtMs(s.ms)}</span>
          </div>`;
      }).join('');
      return `<div class="journey">${rows}</div>`;
    }

    async function tick() {
      try {
        const res = await fetch('/api/status', { cache: 'no-store' });
        const data = await res.json();

        document.getElementById('title').textContent = data.title;
        document.title = data.title;

        const o = document.getElementById('overall');
        o.className = 'overall ' + data.overall;
        const dotState = data.overall === 'operational' ? 'up' : data.overall === 'unknown' ? 'unknown' : 'down';
        o.innerHTML = `<span class="dot ${dotState}"></span>${t(data.overall)}`;

        document.getElementById('list').innerHTML = data.monitors.map(card).join('');
        document.getElementById('footer').textContent = `${t('updated')} ${new Date(data.updatedAt).toLocaleString(locale())}`;
      } catch {
        document.getElementById('overall').innerHTML = `<span class="dot down"></span>${t('offline')}`;
      }
    }

    buildLangSwitcher();
    tick();
    setInterval(tick, 10000);
  </script>
</body>
</html>
